<style>
:root{--bg:#fff;--fg:#000;--mut:#707070;--line:#e6e6e6;--f1:"Reem Kufi",Tahoma,sans-serif;--f2:"IBM Plex Sans Arabic",Tahoma,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0c0c0c;--fg:#f5f5f5;--mut:#9a9a9a;--line:#2a2a2a}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
html,body{margin:0}
body{font-family:var(--f2);font-size:13px;background:var(--bg);color:var(--fg);line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
header{position:fixed;top:0;inset-inline:0;z-index:20;padding-top:env(safe-area-inset-top,0px);color:#fff;transition:background .25s,color .25s}
header.solid{background:var(--bg);color:var(--fg);border-bottom:1px solid var(--line)}
.ann{background:#000;color:#fff;text-align:center;font-size:12px;padding:4px 10px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;padding:0 clamp(14px,2.5vw,32px)}

.ham i:nth-child(2){width:70%}

.hero{position:relative;height:100vh;height:100svh;background:linear-gradient(180deg,#d8d2c9,#8d857a);background-size:cover;background-position:center;color:#fff;display:flex;align-items:flex-end;justify-content:center;text-align:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 50%,#0006)}
.hero>div{position:relative;z-index:1;padding:0 20px clamp(36px,8vh,80px)}
.hero h1{margin:0;display:flex;gap:.3em;justify-content:center;align-items:baseline;flex-wrap:wrap;font:700 clamp(54px,11vw,150px)/1 var(--f1)}

.links{display:flex;gap:28px;justify-content:center;margin-top:22px}

.ban b{font:700 clamp(30px,4.5vw,56px)/1 var(--f1);display:block}
.ban span{border-bottom:1px solid #fff;font-weight:500}
@media(max-width:640px){.ban{grid-template-columns:1fr}}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;padding:44px clamp(14px,2.5vw,32px) 18px}
h2{margin:0;font:700 26px var(--f1)}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;color:var(--mut);padding-bottom:2px}
.tabs button[aria-pressed="true"]{color:var(--fg);border-bottom:1px solid var(--fg)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 2px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{text-align:start;display:block}
.tile .img{position:relative;aspect-ratio:3/4;overflow:hidden}
.tile .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .bd{position:absolute;top:10px;inset-inline-start:10px;background:#fff;color:#000;padding:1px 10px;font-size:11px;font-weight:600}
.tile .t{padding:8px clamp(10px,1vw,14px) 0;display:flex;justify-content:space-between;gap:10px}
.tile .t span{color:var(--mut)}

.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 20px}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px;padding:0}

.rev p{margin:8px 0;font-size:15px}
.rev small{color:var(--mut)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,80px);padding:20px clamp(14px,2.5vw,32px) 70px}
@media(max-width:760px){.svc{grid-template-columns:1fr}}
.svc h3{font:700 20px var(--f1);margin:0 0 10px}
.svc a{text-decoration:none;border-bottom:1px solid currentColor}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:500}
.faq p{margin:8px 0 0;color:var(--mut)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-bottom:1px solid var(--line)}
.trust div{padding:22px clamp(14px,2.5vw,32px);border-inline-start:1px solid var(--line)}
.trust div:first-child{border-inline-start:0}
.trust b{display:block;font-size:15px}.trust span{color:var(--mut)}
footer{border-top:1px solid var(--line);padding:30px clamp(14px,2.5vw,32px) 28px;color:var(--mut);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.ov{position:fixed;inset:0;background:#0006;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(380px,88vw);background:var(--bg);z-index:31;transform:translateX(100%);transition:transform .3s;padding:calc(24px + env(safe-area-inset-top,0px)) 28px 28px;display:flex;flex-direction:column;gap:6px;overflow:auto}
body.menu .ov{opacity:1;pointer-events:auto}
body.menu .side{transform:none}
.side .x{align-self:flex-end;font-size:28px;font-weight:300;margin-bottom:16px}
.side a,.side .m{font-size:22px;font-weight:500;text-decoration:none;text-align:start;padding:6px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
dialog{border:0;padding:28px;width:min(460px,92vw);max-height:90vh;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 6px;font:700 26px var(--f1)}
label{display:block;margin:14px 0 4px;font-weight:500}
.in{width:100%;padding:12px;border:1px solid var(--fg);background:transparent;border-radius:0;font-size:15px}
.row{display:flex;gap:10px;margin-top:20px}
.row button,.pri{padding:13px 22px;border:1px solid var(--fg)}
.row button{flex:1}
.pri{background:var(--fg);color:var(--bg);font-weight:500}
.sz{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sz span{border:1px solid var(--line);padding:4px 14px}
.own{position:fixed;inset-inline-end:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;background:#000;color:#fff;padding:11px 20px;border-radius:99px;font-weight:600;box-shadow:0 4px 18px #0005}
.adm{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.ah{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.ah b{font:700 22px var(--f1)}
.at{display:flex;gap:20px;padding:12px 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.at button{flex:none;color:var(--mut);padding-bottom:2px}
.at button[aria-pressed="true"]{color:var(--fg);border-bottom:2px solid var(--fg)}
.ab{max-width:720px;margin:auto;padding:20px 20px calc(60px + env(safe-area-inset-bottom,0px))}
.rw{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rw span,.mu{color:var(--mut)}
.rw button{margin-inline-start:14px;text-decoration:underline}
.ab h4{margin:26px 0 0;font:700 18px var(--f1);border-bottom:1px solid var(--line);padding-bottom:6px}

:root{--acc:#7a1f32;--soft:#f1f0ed;--f1:"El Messiri","Reem Kufi",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--soft:#181818;--acc:#e0909f}}
:root[data-theme="dark"]{--soft:#181818;--acc:#e0909f}
body{font-size:15px;line-height:1.75}
header{position:sticky;background:var(--bg);color:var(--fg);border-bottom:1px solid var(--line)}
.ann{background:var(--acc);color:#fff}
.bar{height:68px}
.logo{font-size:34px}
.hs{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100svh - 68px);background:var(--soft)}
.ht{display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,6vw,96px)}
.ht h1{margin:0;font:700 clamp(84px,13vw,190px)/.95 var(--f1);display:flex;flex-direction:column;gap:.1em}
.ht h1 span+span{font-size:.3em;font-weight:600;color:var(--acc);line-height:1.2}
.ht p{max-width:26em;margin:22px 0 30px;font-size:18px;color:var(--mut)}
.cta{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.cta a{text-decoration:none}
.ln{border-bottom:1px solid currentColor;padding-bottom:2px;font-weight:500}
.hi{background:linear-gradient(160deg,#cfc9c0,#8a8379);background-size:cover;background-position:center;min-height:50vh}
@media(max-width:760px){.hs{grid-template-columns:1fr}.hi{order:-1;aspect-ratio:4/5;min-height:0}}
a.pri{display:inline-block;text-decoration:none;background:var(--acc);border-color:var(--acc);color:#fff;border-radius:2px}
.ban{display:none!important}
.top{flex-direction:column;align-items:center;text-align:center;padding:clamp(56px,8vw,110px) 20px 30px;gap:20px}
h2{font:700 clamp(32px,4.5vw,52px)/1.1 var(--f1)}
.tabs{justify-content:center;flex-wrap:wrap;gap:10px}
.tabs button{padding:7px 20px;border:1px solid var(--line);border-radius:99px;color:var(--fg)}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#products .grid{max-width:1280px;margin:auto;padding:0 clamp(14px,2.5vw,32px);gap:36px 22px}
.tile .img{aspect-ratio:4/5;background:var(--soft)!important;display:grid;place-items:center}
.tile .img:not(:has(img))::after{content:"بقا";font:700 64px var(--f1);color:var(--line)}
.tile .img img{transition:transform .5s}
.tile:hover .img img{transform:scale(1.04)}
.tile .t{flex-direction:column;gap:2px;padding:14px 0 0}
.tile .t div{font-weight:500;font-size:16px}
.tile .t span{color:var(--acc);font-weight:600}
.rev{max-width:1280px;margin:auto;gap:22px;padding:0 clamp(14px,2.5vw,32px)}
.rev div{border:0;margin:0;background:var(--soft);padding:30px}
.rev div>div{color:var(--acc);padding:0;background:none}
.svc{max-width:1280px;margin:auto}
#service .in{border-color:var(--line);background:var(--soft)}
.in{border-radius:2px}
footer{background:var(--fg);color:var(--bg);border:0;padding:36px clamp(14px,2.5vw,32px)}
@media(prefers-reduced-motion:reduce){.tile .img img{transition:none}}
.tools{display:flex;gap:10px;width:min(560px,100%)}
.tools .in{border-color:var(--line);background:var(--soft)}
.tools #q{flex:3}.tools #so{flex:1}
.sz button{border:1px solid var(--line);padding:5px 16px;border-radius:2px}
.sz button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rw .qt{display:flex;align-items:center;gap:10px}
.rw .qt button{margin:0;text-decoration:none;width:32px;height:32px;border:1px solid var(--line);font-size:18px}
.gt{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.gt button{flex:none;width:64px;height:80px;border:1px solid var(--line);padding:0}
.gt img{width:100%;height:100%;object-fit:cover;display:block}
.th{position:relative;display:inline-block;margin:6px 6px 0 0}
.th img{width:70px;height:88px;object-fit:cover;display:block}
.th button{position:absolute;top:0;inset-inline-end:0;background:#000;color:#fff;width:22px;height:22px;line-height:1;margin:0!important;text-decoration:none!important}
input[type=color].in{height:46px;padding:4px}
.fcart{position:fixed;inset-inline-start:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--acc);color:#fff;padding:11px 20px;border-radius:99px;font-weight:600;box-shadow:0 4px 18px #0005}
.fcart b{margin-inline-start:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{border:1px solid var(--line);padding:20px;text-align:start;display:flex;flex-direction:column}
.card b{font:700 36px/1.1 var(--f1)}.card span{color:var(--mut)}
.dot{background:var(--acc);color:#fff;font-style:normal;border-radius:99px;padding:0 9px;margin-inline-end:8px;font-size:12px}
.msg{background:var(--soft);padding:12px 14px;margin:8px 0}
.msg span{color:var(--mut);font-size:12px}
#reviews .rev{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;max-width:none;margin:0;padding:0 clamp(14px,2.5vw,32px) 12px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
#reviews .rev::-webkit-scrollbar{display:none}
#reviews .rc{flex:0 0 min(300px,78vw);scroll-snap-align:start;background:var(--soft);display:flex;flex-direction:column;margin:0;padding:0;border:0}
#reviews .rc .ri{width:100%;aspect-ratio:1;object-fit:cover;display:block}
#reviews .rc .rt{padding:22px;background:none;margin:0}
#reviews .rc .st{padding:0;background:none;color:var(--acc);margin:0;letter-spacing:2px}
.rnav{display:flex;gap:8px}
.rnav button{width:40px;height:40px;border:1px solid var(--line);font-size:22px;line-height:1}
@media (hover:none){.rnav{display:none!important}}
footer{padding-bottom:90px}
.ci{display:flex;gap:12px;align-items:center;min-width:0}
.ci img,.ci i{flex:none;width:56px;height:72px;object-fit:cover;background:var(--soft);display:block}
.ci>div{min-width:0}
.cnt{display:inline-block;vertical-align:middle;font:600 14px var(--f2);background:var(--acc);color:#fff;border-radius:99px;padding:1px 12px;margin-inline-start:8px}
.hrt{position:absolute;top:10px;inset-inline-end:10px;font-size:20px;line-height:1;background:var(--bg);color:var(--acc);border-radius:99px;width:34px;height:34px;display:grid;place-items:center;z-index:2}
#zd{padding:0;width:min(96vw,900px);background:none}#zd::backdrop{background:#000c}
#sbs{padding:40px 20px}

/* ===== Full-screen photo hero + SHOP ALL ===== */
.hs{display:block;position:relative;height:calc(100svh - 68px);min-height:520px;background:#111;overflow:hidden}
.hs .ht{display:none}
.hs .hi,.hs .hi{position:absolute;inset:0;min-height:0;aspect-ratio:auto;order:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.hs::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,#0000 55%,#0005)}
.shop{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-decoration:none;color:#fff;font:600 clamp(14px,2.2vw,20px)/1 var(--f2);letter-spacing:.28em;text-transform:uppercase;text-shadow:0 1px 12px #0008}
.shop span{padding:14px 6px 10px;border-bottom:1px solid #fff;transition:letter-spacing .3s,opacity .3s}
.shop:hover span,.shop:focus-visible span{letter-spacing:.38em}
@media(max-width:760px){.hs{height:calc(100svh - 68px);min-height:480px}.hs .hi{aspect-ratio:auto}}

/* ===== Dark starry theme (inspired by reference) ===== */
html:root:root{--bg:#000;--fg:#fff;--mut:#9a9a9a;--line:#2a2a2a;--soft:#0f0f0f;--acc:#fff!important;--f1:"Chakra Petch","El Messiri","Reem Kufi",Tahoma,sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--fg)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
header{background:rgba(0,0,0,.9)!important;border-bottom:1px solid #ffffff14!important}
.logo,h2{text-shadow:0 0 18px #ffffff40}
.ann{color:#000!important}
/* hero */
.hs .hi{background:radial-gradient(circle at 70% 30%,#2e2e2e,#000 70%);background-size:cover;background-position:center}
.hs .hi::after{display:none}
.hs::after{background:linear-gradient(180deg,#0000 58%,var(--bg))!important}
.shop{font-family:var(--f1)}
/* buttons: thin outline */
.pri,a.pri,button.pri{background:transparent;color:var(--fg);border:1px solid var(--fg);border-radius:99px;box-shadow:none;transition:background .25s,color .25s}
.pri:hover,a.pri:hover,button.pri:hover{background:var(--fg);color:var(--bg)}
.row button{border-radius:99px;border-color:var(--fg)}
.row button:hover:not(:disabled){background:var(--fg);color:var(--bg)}
.row button:disabled{opacity:.55;letter-spacing:.2em;font-family:var(--f1)}
.in{background:transparent;border-color:#ffffff40;border-radius:12px}
#service .in,.tools .in{background:var(--soft)}
.fcart,.dot,.cnt{color:#000}
.own{border:1px solid #ffffff40}
footer{background:#000!important;color:var(--mut)!important;border-top:1px solid var(--line)}
/* glow around products */
#products .grid{gap:44px 26px}
.tile .img{overflow:visible;background:transparent!important}
.tile .img img{filter:drop-shadow(0 0 14px #ffffff40);transition:transform .5s}
.tile:hover .img img,.tile:focus-visible .img img{transform:scale(1.04)}
.tile .t div{font-family:var(--f1);font-weight:600;letter-spacing:.02em}
.tile .t span{color:var(--acc)}
.tile .bd{background:#ffffffe6;color:#000;border-radius:99px;font:600 11px var(--f1);letter-spacing:.08em;padding:2px 12px}
.tile.so .img img{opacity:.55}
.tile.so .bd{background:#ffffffe6}
#pd #gm{filter:drop-shadow(0 0 22px #ffffff33)}
/* dialogs */
dialog{border:1px solid #ffffff1f;border-radius:20px;box-shadow:0 0 60px #ffffff14}
dialog::backdrop{background:#000b}
dialog[open]{animation:dgIn .35s ease}
@keyframes dgIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
/* cart as side drawer */
dialog#cd{margin:0;inset:0 auto 0 0;width:min(430px,94vw);height:100dvh;max-height:none;border-radius:0;border-width:0 1px 0 0;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px))}
dialog#cd[open]{animation:drIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes drIn{from{transform:translateX(-100%)}}
/* page transition */
#pt{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s ease}
#pt.on{opacity:1;pointer-events:auto}
#pt span{font:600 12px var(--f1);letter-spacing:.5em;color:#ffffffb3;padding-inline-start:.5em;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){dialog[open],dialog#cd[open]{animation:none}#pt{transition:none}}

/* hidden admin entry: 10 quick taps on the logo */
#logo{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.own{display:none!important}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="pt" class="on" aria-hidden="true"><span id="ptt"></span></div>

<header id="hd">
  <div class="ann" id="ann" hidden></div>
  <div class="bar">

async function shrink(f,max){
 if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;
 try{const bm=await createImageBitmap(f),k=Math.min(1,max/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
  const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  return bl&&bl.size<f.size?new File([bl],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}
}

<script>
/* starry background + page transitions */
(()=>{
 const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const cv=document.getElementById('stars'),cx=cv&&cv.getContext('2d');
 let W=0,H=0,D=1,st=[],raf=0;
 function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;
  const n=Math.min(220,Math.round(W*H/7000));st=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random()*.6+.3,p:Math.random()*6.28,s:Math.random()*1.2+.4}));draw(0)}
 function draw(t){cx.setTransform(D,0,0,D,0,0);cx.clearRect(0,0,W,H);
  for(const o of st){const a=o.a*(rm?1:.65+.35*Math.sin(t/1000*o.s+o.p));cx.globalAlpha=a;cx.fillStyle='#fff';cx.beginPath();cx.arc(o.x,o.y,o.r,0,6.283);cx.fill()}
  cx.globalAlpha=1}
 function loop(t){draw(t);raf=requestAnimationFrame(loop)}
 if(cx){size();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(size,200)})}
 const pt=document.getElementById('pt'),ptt=document.getElementById('ptt');
 const brand=()=>{const l=document.getElementById('logo');return l?l.textContent.trim():''};
 ptt.textContent=brand();
 let to=0;
 const hide=()=>{clearTimeout(to);pt.classList.remove('on')};
 // loader: show black screen with the brand, then reveal
 if(document.readyState==='loading')addEventListener('DOMContentLoaded',hide);else hide();
 setTimeout(hide,1200);
})();
</script>
